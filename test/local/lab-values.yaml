# Values for the local harness. Only what matters for rendering the nginx and Fluent Bit
# configs; cluster-only concerns (route, pull secrets) are irrelevant here.

cloudProvider:
  dockerRegistryUrl: ""
  imagePullSecretName: ""
  flavor: minikube

authorization:
  enabled: false

# No upstream by default, so nginx answers from its own docroot.
backend:
  enabled: false

opentelemetry:
  exporterHost: "127.0.0.1"
  samplerMethod: "AlwaysOff"

route:
  enabled: false

fluentbit:
  enabled: true
  debug:
    enabled: true
  output:
    logs:
      # The harness's stand-in for central Alloy (docker-compose.yml).
      host: "otel-collector"
      port: 4318
      protocol: http
  accessLog:
    forward:
      serverErrors: true
      # Both stated explicitly (they match the chart defaults) so the harness's forwarding
      # selection is readable without cross-checking values.yaml.
      clientErrors: true
    metrics:
      enabled: true
      scrapeExporter: true
  errorLog:
    enabled: true
