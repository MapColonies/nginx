# Mock central Alloy: accepts OTLP/HTTP on 4318 and prints whatever it receives, so the
# harness can show what actually got forwarded.
#
# Caveat: this input does not surface OTLP log *attributes* back as record fields. Access
# records show their full OTel shape, but for error records you only see the body. To check
# attributes, point fluentbit.output.logs.host at a raw HTTP endpoint and read the payload.

[SERVICE]
    flush     1
    daemon    off
    log_level info

[INPUT]
    Name   opentelemetry
    Tag    received
    Listen 0.0.0.0
    Port   4318

[OUTPUT]
    Name   stdout
    Match  *
    Format json
