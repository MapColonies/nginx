# Reproduces the sidecar pod outside Kubernetes, shipping into a real OTel backend.
#
# fluent-bit joins nginx's network namespace, so `Listen 127.0.0.1` and
# `access_log syslog:server=127.0.0.1` behave exactly as they do in a pod. nginx owns the
# namespace and therefore publishes the ports for both containers.
#
# The forwarding path mirrors production -- sidecar -> OTLP/HTTP -> collector -> Loki:
# otel-collector stands in for central Alloy and prints every record it receives fully
# decoded, then passes it to lgtm, where it can be queried like any other log.
#
# Configs come from ./rendered/, produced by ./render.py -- see README.md.

services:
  nginx:
    build: ../../docker-image
    ports:
      - "8080:8080" # site
      - "8081:8081" # nginx_status
      - "2021:2021" # fluent-bit's merged /metrics, served inside this namespace
    volumes:
      - ./rendered/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./rendered/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./rendered/log_format.conf:/etc/nginx/log_format.conf:ro

  # Keep this tag in step with fluentbit.image.tag in helm/values.yaml.
  fluent-bit:
    image: fluent/fluent-bit:${FLUENT_BIT_TAG:-5.0.7}
    network_mode: "service:nginx"
    depends_on:
      - nginx
    # Same override the chart applies: the image's default command loads the classic
    # fluent-bit.conf, and the sidecar's config is YAML.
    command: ["-c", "/fluent-bit/etc/fluent-bit.yaml"]
    volumes:
      - ./rendered/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro

  # Present so fluentbit.accessLog.metrics.scrapeExporter (on by default) has something real
  # to scrape, and the merged /metrics can be checked for the stub_status gauges.
  nginx-prometheus-exporter:
    image: nginx/nginx-prometheus-exporter:${EXPORTER_TAG:-1.5.1}
    command: ["-nginx.scrape-uri=http://localhost:8081/nginx_status"]
    network_mode: "service:nginx"
    depends_on:
      - nginx

  # Stands in for central Alloy. Its debug exporter is the only view of what the sidecar
  # actually put on the wire -- resource attributes, log attributes, severity, body.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_TAG:-latest}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - lgtm

  # OTel Collector -> Loki/Prometheus/Tempo + Grafana. Large image (~1.5 GB), pulled once.
  lgtm:
    image: grafana/otel-lgtm:${LGTM_TAG:-latest}
    ports:
      - "3000:3000" # Grafana
      - "3100:3100" # Loki HTTP API, what ./loki.py queries
