# Fluent Bit configuration, rendered through Helm `tpl` from the chart ConfigMap
# (mirroring how nginx.conf / log_format.conf are shipped).
#
# Access-log forwarding pipeline: nginx ships its JSON access log here over syslog UDP on
# loopback (best-effort); Fluent Bit filters it down to the selected status codes and
# forwards only those to central Alloy over OTLP. Everything else is dropped at the source.
#
# Metrics pipeline (fluentbit.accessLog.metrics): derive Prometheus metrics from the same
# stream, merge with the scraped nginx exporter, and serve one /metrics endpoint.

{{- $debug := .Values.fluentbit.debug }}
{{- $stages := ternary $debug.stages (dict) $debug.enabled }}
[SERVICE]
    flush        1
    daemon       off
    log_level    {{ $debug.enabled | ternary $debug.logLevel "info" }}
    parsers_file parsers.conf
{{- if .Values.fluentbit.errorLog.enabled }}
    parsers_file fluent-bit-parsers.conf
{{- end }}

# nginx `access_log syslog:server=127.0.0.1:<port>` delivers the JSON `main` format here.
# Parser is mandatory: nginx frames its datagrams as RFC3164 (`<PRI>Mmm dd hh:mm:ss host
# tag: msg`), while Fluent Bit's syslog input defaults to syslog-rfc5424 — that mismatch
# fails to parse and silently drops every record before any filter runs.
[INPUT]
    Name              syslog
    Tag               nginx.access
    Mode              udp
    Listen            127.0.0.1
    Port              {{ .Values.fluentbit.accessLog.syslogPort }}
    Parser            syslog-rfc3164
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k
{{ if .Values.fluentbit.errorLog.enabled }}
# Error-log pipeline: distinct port and tag (nginx.error) from the access pipeline.
# Same RFC3164 framing as the access log, so the same explicit parser is required.
[INPUT]
    Name              syslog
    Tag               nginx.error
    Mode              udp
    Listen            127.0.0.1
    Port              {{ .Values.fluentbit.errorLog.syslogPort }}
    Parser            syslog-rfc3164
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   64k
{{ end }}
{{ if .Values.fluentbit.accessLog.metrics.enabled }}
# Fluent Bit's own metrics (records/bytes in and out, retries, uptime) — a rough signal for
# sizing the sidecar (compare input records against nginx's request count).
[INPUT]
    Name            fluentbit_metrics
    Tag             nginx.metrics.fluentbit
    Scrape_Interval 30
{{ if .Values.fluentbit.accessLog.metrics.scrapeExporter }}
# Scrape the existing nginx-prometheus-exporter so its stub_status gauges merge into the
# single /metrics endpoint below (Port = the exporter's own mclabels.prometheus.port).
[INPUT]
    Name         prometheus_scrape
    Tag          nginx.metrics.exporter
    Host         127.0.0.1
    Port         {{ .Values.mclabels.prometheus.port }}
    Metrics_Path /metrics
{{ end }}
{{- end }}
{{ if $stages.received }}
# Debug stage `received`: both pipelines straight off the syslog input, before any decoding.
# `stdout` is a filter, so it prints the records as they are at this point and passes them on.
[FILTER]
    Name        stdout
    Match_regex ^nginx\.(access|error)$
{{ end }}
# The syslog message body is the nginx JSON line; decode it so the OTel-shaped fields
# (including the nested http.response.status_code) become queryable by the grep filter.
[FILTER]
    Name         parser
    Match        nginx.access
    Key_Name     message
    Parser       json
    Reserve_Data Off
{{ if $stages.parsed }}
# Debug stage `parsed`: access records after JSON decode. Deliberately ahead of the guard
# below, so lines the decode failed on are still visible here (they keep a raw `message`).
[FILTER]
    Name  stdout
    Match nginx.access
{{ end }}

# Drop records the JSON parser could not decode. log_to_metrics segfaults on a record whose
# Value_Field is missing, so an unparseable line would otherwise crash-loop the sidecar.
[FILTER]
    Name  grep
    Match nginx.access
    Regex $Attributes['http.response.status_code'] .
{{ if .Values.fluentbit.accessLog.exclude.enabled }}
# Drop health-check / probe traffic before anything downstream sees it, so it neither
# inflates the derived metrics nor reaches Loki. Placed after the JSON parser (the matched
# field only exists once decoded) and before log_to_metrics.
[FILTER]
    Name    grep
    Match   nginx.access
    Exclude {{ .Values.fluentbit.accessLog.exclude.key }} {{ .Values.fluentbit.accessLog.exclude.regex }}
{{ end }}
{{ if .Values.fluentbit.accessLog.metrics.enabled }}
# Derive metrics from the full stream, before grep drops the non-forwarded records, so the
# counters cover every request. Raw, overridable fluentbit.accessLog.metrics.config (tpl).
{{ tpl .Values.fluentbit.accessLog.metrics.config . -}}
{{ end }}
# Keep only the status codes selected by fluentbit.accessLog.forward; drop everything else.
# When no forwarding rule is active the regex matches nothing, so all records are dropped.
[FILTER]
    Name  grep
    Match nginx.access
    Regex $Attributes['http.response.status_code'] {{ include "nginx.fluentbit.accessLogRegex" . }}
{{ if .Values.fluentbit.errorLog.enabled }}
# Parse the plaintext nginx error line into structured fields. The nginx_error parser ships in
# the extra parsers_file loaded by [SERVICE]. Severity is already filtered at nginx, so no grep.
[FILTER]
    Name         parser
    Match        nginx.error
    Key_Name     message
    Parser       nginx_error
    Reserve_Data Off
{{ if $stages.parsed }}
# Debug stage `parsed`, error pipeline.
[FILTER]
    Name  stdout
    Match nginx.error
{{ end }}
{{ end }}
# Forward the surviving records to the dedicated central Alloy OTLP/HTTP logs endpoint
# (fluentbit.output.logs.*, deliberately NOT the traces-only opentelemetry.exporterHost).
[OUTPUT]
    Name     opentelemetry
    Match    nginx.access
    Host     {{ include "nginx.fluentbit.logsHost" . }}
    Port     {{ .Values.fluentbit.output.logs.port }}
    Logs_uri /v1/logs
    {{- if eq .Values.fluentbit.output.logs.protocol "https" }}
    Tls      On
    {{- end }}
{{- if .Values.fluentbit.errorLog.enabled }}

# Error-log records to the same OTLP logs endpoint as the access logs (tag-isolated).
# Unlike the access log, these records are not already OTel-shaped: without an explicit
# body/attribute mapping the output keeps only the message and discards the parsed
# level/pid/client/request fields.
[OUTPUT]
    Name                           opentelemetry
    Match                          nginx.error
    Host                           {{ include "nginx.fluentbit.logsHost" . }}
    Port                           {{ .Values.fluentbit.output.logs.port }}
    Logs_uri                       /v1/logs
    Logs_body_key                  $message
    Logs_body_key_attributes       On
    Logs_severity_text_message_key $level
    {{- if eq .Values.fluentbit.output.logs.protocol "https" }}
    Tls                            On
    {{- end }}
{{- end }}
{{- if $debug.enabled }}

# Debug: the records handed to the OTLP outputs above, i.e. what actually reaches Alloy once
# every filter has run. Always printed while debug is on — out_stdout flushes the process's
# stdout buffer, which is what makes the `stdout` filter dumps above appear promptly too.
[OUTPUT]
    Name        stdout
    Match_regex ^nginx\.(access|error)$
{{- end }}
{{- if .Values.fluentbit.accessLog.metrics.enabled }}

# Serve the merged /metrics (log-derived + scraped exporter + Fluent Bit's own) on
# metrics.port. Match * is safe — prometheus_exporter only handles metric events, not logs.
[OUTPUT]
    Name  prometheus_exporter
    Match *
    Host  0.0.0.0
    Port  {{ .Values.fluentbit.accessLog.metrics.port }}
{{- end }}
