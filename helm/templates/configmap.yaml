apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-base-configmap" (include "nginx.fullname" .) }}
  labels:
    {{- include "nginx.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- tpl (.Files.Get "config/default.conf") . | nindent 4 }}
  nginx.conf: |
    {{- tpl (.Files.Get "config/nginx.conf") . | nindent 4 }}
  log_format.conf: |
    {{- tpl (.Files.Get "config/log_format.conf") . | nindent 4 }}
