global:
  # -- Global cloud provider configuration.
  cloudProvider: {}
  # -- Configuration for distributed tracing.
  tracing: {}
  # -- Configuration for metrics collection.
  metrics: {}
  # -- Global environment setting.
  environment: ""
  ingress:
    # -- Domain name for the ingress.
    domain: ""

mclabels:
  environment: development
  owner: common
  partOf: nginx
  component: proxy-server
  prometheus:
    enabled: true
    port: 9113
  logScraping: true

# -- Enable or disable the deployment of this chart
enabled: true
# -- Specify the environment for this deployment
environment: development
# -- Number of replicas to deploy
replicaCount: 1
# -- Initial delay in seconds before the readiness probe starts
initialDelaySeconds: 60
# -- If true, triggers a rolling update when the configuration changes
resetOnConfigChange: true
# -- Image pull policy for all containers in the deployment
imagePullPolicy: Always

# -- String to partially override fullname template (will maintain the release name)
nameOverride: ""
# -- String to fully override fullname template
fullnameOverride: ""

# -- Specify the cloud provider where the chart is being deployed
cloudProvider:
  # -- URL of the Docker registry to pull images from
  dockerRegistryUrl: my-registry-url
  # -- Name of the Kubernetes secret containing the image pull credentials
  imagePullSecretName: imagepullsecret
  # -- Specify the flavor of the deployment
  flavor: openshift

# -- Name of the Kubernetes secret containing the CA certificate
caSecretName: ""
# -- Path where the CA certificate will be mounted in the container
caPath: "/usr/local/share/ca-certificates"
# -- Key in the CA secret that contains the certificate data
caKey: "ca.crt"

image:
  # -- Docker image name
  repository: common/nginx
  # -- Docker image tag. If no value is specified, appVersion will be taken.
  tag: ""
# -- Port on which the application will listen
port: 8080
# -- Port to which the service will forward traffic
targetPort: 8080
# -- Port on which the site status will be available
siteStatusPort: 8081
# -- Port to expose on each node for NodePort service type
nodePort: 30001
resources:
  # -- Use custom resources
  enabled: true
  value:
    limits:
      # -- Pod CPU limit
      cpu: 100m
      # -- Pod memory limit
      memory: 128Mi
    requests:
      # -- Pod CPU request
      cpu: 100m
      # --Pod memory request
      memory: 128Mi

# -- Use this property in order to add custom annotations to the Pod
additionalPodAnnotations: {}

# Add extra volumes to the Deployment, for example
# - name: nginx-config
#   configMap:
#    name: 'nginx-extra-configmap'
#
# -- List of extra volumes that are added to the Deployment
extraVolumes: []

# Add extra volumeMounts to the Pod, for example
# - name: nginx-config
#   mountPath: "/etc/nginx/conf.d/default.conf"
#   subPath: default.conf
#
# -- List of extra volumeMounts that are added to the NGINX container
extraVolumeMounts: []

# Add side car to the Deployment, for example
# sidecars: |-
#   - name: envoy
#     image: "{{ .Values.envoy.image }}:{{ .Values.envoy.imageTag }}"
#     volumeMounts: []
#     args: []
#     ports: []
#     resources:
#     {{- toYaml .Values.envoy.resources.value | nindent 12 }}
#
# -- String consists of a list of sidecars containers that are added to the Deployment
sidecars: ""

backend:
  # -- Enable or disable the backend service
  enabled: true
  # -- Backend service name for proxy_pass
  host: ""
  # -- Backend service port
  port: 8080

  # @section -- OpenTelemetry Support
opentelemetry:
  # -- OpenTelemetry service name to be associated your NGINX application
  serviceName: nginx
  # -- OpenTelemetry Collector endpoint address
  # exporterHost: "localhost"
  exporterPort: 4317 # gRPC port for OpenTelemetry Collector
  # -- OpenTelemetry sampling method
  samplerMethod: "AlwaysOff" # AlwaysOn, AlwaysOff, TraceIdRatioBased
  # -- OpenTelemetry sampling ratio
  ratio: 10 # between 0 and 1

# @section -- Nginx Configuration
nginx:
  extensions:
    server:
      # -- Enable or disable the inclusion of an additional configuration file in the SERVER context of NGINX configuration
      enabled: false
      # -- Name of the additional configuration file to be included in the NGINX configuration (should be mounted to the "config"/extensions directory)
      fileName: server.conf
    location:
      # -- Enable or disable the inclusion of an additional configuration file in the ROOT PATH context of NGINX configuration
      enabled: false
      # -- Name of the additional configuration file to be included in the NGINX root path configuration (should be mounted to the "config"/extensions directory)
      fileName: location.conf
  # -- Maximum age of the cache in seconds (for the header: Access-Control-Max-Age)
  maxAge:
  # -- Allowed origins, default: * (comma-seperated, for the header: Access-Control-Allow-Origin)
  allowedOrigins:
  # -- Allowed headers, default: * (comma-seperated, for the header: Access-Control-Allow-Headers)
  allowedHeaders:
  # -- Allowed methods, default: GET, OPTIONS (comma-seperated, for the header: Access-Control-Allow-Methods)
  allowedMethods:
  # -- Maximum age of the OPTIONS cache in seconds (for the header: Access-Control-Max-Age)
  optionsMaxAge:

  # @section -- NGINX-Prometheus-Exporter Parameters
prometheusExporter:
  # -- Enable or disable the Prometheus exporter sidecar
  enabled: true
  image:
    # -- Docker image name for the Prometheus exporter
    repository: common/nginx-prometheus-exporter
    # -- Docker image tag for the Prometheus exporter
    tag: 1.5.1
    # -- Image pull policy for the Prometheus exporter
    pullPolicy: IfNotPresent
  resources:
    # -- Enable or disable resource limits and requests
    enabled: true
    value:
      limits:
        # -- CPU limit for the main container
        cpu: 100m
        # -- Memory limit for the main container
        memory: 128Mi
      requests:
        # -- CPU request for the main container
        cpu: 100m
        # -- Memory request for the main container
        memory: 128Mi

  # @section -- Fluent Bit Log-Processing Sidecar
fluentbit:
  # -- Enable or disable the optional Fluent Bit log-processing sidecar. When enabled, the central log-scraping label is forced off (no override) and the Prometheus scrape port is pointed at Fluent Bit's merged /metrics endpoint. When disabled (the default), the chart behaves exactly as before.
  enabled: false
  image:
    # -- Docker image name for the Fluent Bit sidecar
    repository: common/fluent-bit
    # -- Docker image tag for the Fluent Bit sidecar
    tag: "5.0.7"
    # -- Image pull policy for the Fluent Bit sidecar
    pullPolicy: IfNotPresent
  resources:
    # -- Enable or disable resource limits and requests for the Fluent Bit sidecar
    enabled: true
    value:
      limits:
        # -- CPU limit for the Fluent Bit sidecar
        cpu: 100m
        # -- Memory limit for the Fluent Bit sidecar
        memory: 128Mi
      requests:
        # -- CPU request for the Fluent Bit sidecar
        cpu: 100m
        # -- Memory request for the Fluent Bit sidecar
        memory: 128Mi
  output:
    logs:
      # -- Host of the dedicated central Alloy OTLP logs endpoint Fluent Bit forwards to. Deliberately NOT reused from opentelemetry.exporterHost (that is the traces-only endpoint). Required when the sidecar is enabled.
      host: ""
      # -- Port of the central Alloy OTLP/HTTP logs endpoint.
      port: 4318
      # -- Protocol used to reach the OTLP logs endpoint (http or https).
      protocol: http
  accessLog:
    # -- UDP port on loopback where Fluent Bit's syslog input listens and to which nginx forwards its JSON-formatted access log.
    syslogPort: 5514
    # -- When true, nginx writes a human-readable (combined-style) access log to stdout for kubectl logs; the JSON log always goes to Fluent Bit over syslog. When false, stdout also receives the JSON format.
    stdoutReadable: true
    exclude:
      # -- Drop matching access-log records before metrics are derived and before forwarding, so probe/health-check traffic neither skews the metrics nor reaches Loki. Note the kubelet liveness path (`/nginx_status`) is already excluded by `access_log off` in the image's status_site.conf; this is for probes that hit the main server (router/LB health checks, custom health endpoints).
      enabled: false
      # -- Fluent Bit record accessor the exclude regex is matched against. Must be a field of the decoded JSON access log.
      key: $Attributes['url.path']
      # -- Regex matched against `key`; records that match are dropped. Covers the common liveness/readiness path spellings. Only used when enabled.
      regex: ^/(health|healthz|live|livez|liveness|ready|readyz|readiness|nginx_status)$
    forward:
      # -- Forward server errors (5xx) to central Alloy. On by default so incident-relevant logs reach Loki with no configuration.
      serverErrors: true
      # -- Forward client errors (4xx) to central Alloy.
      clientErrors: true
      # -- Extra explicit status codes to forward beyond the error classes, e.g. [429, 499]. Everything not matched by any rule is dropped.
      statusCodes: []
    metrics:
      # -- Derive Prometheus metrics from the access log and serve them on the merged /metrics endpoint. When false, no metrics blocks are rendered.
      enabled: true
      # -- Scrape the existing nginx-prometheus-exporter and merge its series into the endpoint, preserving the stub_status gauges.
      scrapeExporter: true
      # -- Port on which Fluent Bit serves the merged /metrics endpoint. When enabled, this becomes the pod's advertised scrape port (mclabels.prometheus.port).
      port: 2021
      # -- Fluent Bit filter entries (a YAML list, tpl-rendered) that derive metrics from the access log; spliced into the sidecar's `pipeline.filters`. Default: a per-status-code counter and a request_time histogram. Replacing this replaces both. WARNING: never label by high-cardinality fields (path, query, client IP, user-agent) — it can OOM the sidecar.
      # @default -- per-status-code counter + request_time histogram (see values.yaml)
      config:
        # Per-status-code response counter (status_code is bounded, safe to label). Named
        # responses_total, not requests_total: the scraped exporter already publishes an
        # unlabelled nginx_http_requests_total, and two same-named families on one endpoint
        # make Prometheus reject the whole scrape.
        - name: log_to_metrics
          match: nginx.access
          tag: nginx.metrics
          metric_mode: counter
          metric_namespace: nginx
          metric_subsystem: http
          metric_name: responses_total
          metric_description: Total nginx HTTP responses by status code
          add_label: status_code $Attributes['http.response.status_code']
        # Request-time histogram in seconds. Buckets default to Prometheus's standard set.
        - name: log_to_metrics
          match: nginx.access
          tag: nginx.metrics
          metric_mode: histogram
          metric_namespace: nginx
          metric_subsystem: http
          metric_name: request_duration_seconds
          metric_description: nginx request processing time in seconds
          value_field: $Attributes['mapcolonies.request_time']
  errorLog:
    # -- Ship nginx error logs through a separate Fluent Bit pipeline (syslog input, plaintext parser, severity filter, OTLP output). Independent of the access-log pipeline. Only takes effect when fluentbit.enabled is also true.
    enabled: true
    # -- UDP port on loopback where Fluent Bit's error-log syslog input listens and to which nginx forwards its error log. Distinct from accessLog.syslogPort.
    syslogPort: 5515
    # -- Forward error-log records at or above this severity, applied natively by nginx's error_log directive (records below never leave nginx). Ordering: debug < info < notice < warn < error < crit < alert < emerg. The OSS image cannot emit `debug` (needs a debug-enabled build).
    minLevel: warn
  lua:
    # -- Mount a custom Lua script into the Fluent Bit sidecar for advanced filtering (e.g. latency-threshold forwarding) with no chart change. When enabled, the script is added to the Fluent Bit ConfigMap and mounted at /fluent-bit/scripts/custom.lua; reference it from a `- name: lua` filter entry you supply through fluentbit.accessLog.metrics.config (the chart never inserts one). When disabled (the default), no Lua key or volumeMount is rendered.
    enabled: false
    # -- Inline Lua script (tpl-rendered, so it can reference `.Release.Name`, chart values, etc.) mounted at /fluent-bit/scripts/custom.lua. Only used when enabled.
    script: ""
  debug:
    # -- Print the log stream to the sidecar's own stdout (`kubectl logs <pod> -c fluent-bit`) for troubleshooting. Always prints the records handed to the OTLP output; `stages` add earlier snapshots taken by `stdout` filters at those points in the pipeline. Off by default: it prints every record the sidecar handles, which is the volume this feature exists to avoid shipping.
    enabled: false
    # -- Fluent Bit's service log level while debug is enabled. `debug` reports plugin-level decisions, `trace` is extremely verbose. When debug is disabled the level is always `info`.
    logLevel: debug
    stages:
      # -- Dump records as they arrive from nginx, before the body is decoded. Answers "is nginx delivering anything, and is the syslog envelope what Fluent Bit expects" — the only stage that shows lines the parser later rejects.
      received: false
      # -- Dump records once the body is decoded (JSON for access logs, the nginx_error parser for error logs) and before the metrics and forwarding filters. Shows the fields the rest of the pipeline actually sees; a record still holding a raw `message` means the decode failed. Comparing this against the always-printed output dump is what shows which filter dropped a record.
      parsed: true

authorization:
  # -- Use authroization mechanism
  enabled: true
  # -- Your authorization domain
  domain: "example"
  # -- Authorization endpoint
  url: "http://localhost:8181/v1/data/http/authz/decision"

route:
  # -- Expose NGINX as an Openshift route
  enabled: true
  routesMapping:
    # -- Path of route
    - path: /
      # -- Host of route
      host:
  timeout:
    # -- Use custom timeout duration of the route
    enabled: false # defaults to 30s by openshift
    # -- Set the timeout duration of the route. Defaults to 30s by Openshift
    duration: 60s # supported units (us, ms, s, m, h, d)
  # -- Rewrite route target
  rewriteTarget: ""
  tls:
    # -- Use route over HTTPS
    enabled: true
    # -- Set the termination of the route
    termination: edge
    # -- Policy for traffic on insecure schemes like HTTP
    insecureEdgeTerminationPolicy: Redirect
    # -- Use custom certificates for the route
    useCerts: false
    # -- Set the certificate of the route
    certificate: ""
    # -- Set the key of the route
    key: ""
    # -- Set the CA certificate of the route
    caCertificate: ""

ingress:
  # -- Expose NGINX as an Ingress
  enabled: false
  # -- Class name of ingress
  ingressClassName: nginx
  # -- Additional annotations for ingress
  additionalAnnotations:
    # for NGINX ingress controller
    # kubernetes.io/ingress.class: nginx
    # nginx.ingress.kubernetes.io/rewrite-target: /
    #
  ingressMapping:
    # -- Path of ingress
    - path: /
      # -- Host of ingress
      host:
      # -- Path Type of ingreaa
      pathType: Prefix
  # -- Domain of ingress
  domain: ""
  tls:
    # -- Use ingress over HTTPS
    enabled: false
    # -- Secret name of ingress that points to the relevant custom certificates
    secretName: ""
